<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Straßburg-Rallye</title>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">À la découverte de Strasbourg</div>
    <h1>Straßburg entdecken</h1>
  </div>
  <button id="langBtn" aria-label="Sprache wechseln">FR</button>
</header>

<main>
<section id="home" class="view active">
  <div class="hero">
    <div class="badge">10 Stationen · 2–3 Stunden</div>
    <h2 data-de="Eine Stadt zwischen Geschichte, Sprache und Europa" data-fr="Une ville entre histoire, langues et Europe"></h2>
    <p data-de="Arbeitet im Team, löst Aufgaben, sammelt Punkte und entdeckt Straßburg auf Deutsch und Französisch."
       data-fr="Travaillez en équipe, résolvez les missions, gagnez des points et découvrez Strasbourg en allemand et en français."></p>
    <label><span data-de="Teamname" data-fr="Nom de l’équipe"></span>
      <input id="teamName" placeholder="Les explorateurs">
    </label>
    <button class="primary" id="startBtn" data-de="Rallye starten" data-fr="Commencer le rallye"></button>
  </div>
  <div class="card">
    <h3 data-de="So funktioniert’s" data-fr="Comment ça marche"></h3>
    <p data-de="An jeder Station: lesen, beobachten, antworten, fotografieren und abhaken."
       data-fr="À chaque étape : lire, observer, répondre, photographier et valider."></p>
  </div>
</section>

<section id="list" class="view">
  <div class="toolbar">
    <button class="ghost" data-nav="home">← <span data-de="Start" data-fr="Accueil"></span></button>
    <div><strong id="score">0</strong> / 100 ⭐</div>
  </div>
  <div id="stationList"></div>
</section>

<section id="station" class="view">
  <div class="toolbar">
    <button class="ghost" data-nav="list">← <span data-de="Übersicht" data-fr="Parcours"></span></button>
    <div id="stationCounter"></div>
  </div>
  <article id="stationCard"></article>
</section>

<section id="finish" class="view">
  <div class="hero">
    <div class="badge">🏆</div>
    <h2 data-de="Geschafft!" data-fr="Bravo !"></h2>
    <p id="finishText"></p>
    <button class="primary" data-nav="list" data-de="Ergebnisse ansehen" data-fr="Voir les résultats"></button>
    <button class="ghost" id="resetBtn" data-de="Neu starten" data-fr="Recommencer"></button>
  </div>
</section>
</main>

<nav>
  <button data-nav="home">⌂<small data-de="Start" data-fr="Accueil"></small></button>
  <button data-nav="list">☷<small data-de="Stationen" data-fr="Étapes"></small></button>
  <button id="installBtn" hidden>＋<small data-de="Installieren" data-fr="Installer"></small></button>
</nav>

<script src="app.js"></script>
</body>
</html>
